openapi: 3.0.3
info:
  title: VisionServe API
  description: >
    Phase 0-4 surface of the VisionServe backend: system health/version
    endpoints, the Phase 3 image utility endpoints, and the Phase 4 object
    detection endpoint. This is a starting point, not the complete API — it
    grows alongside the roadmap (jobs, batches, auth, ...).
  version: "0.1.0"
servers:
  - url: http://localhost:8081
    description: Local dev (see wiki Getting-Started)
  - url: https://visionserve-api.up.railway.app
    description: Railway deployment (see wiki Deployment) — actual URL varies per project

paths:
  /health:
    get:
      summary: Liveness probe
      description: Returns 200 as long as the process is running.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /ready:
    get:
      summary: Readiness probe
      description: >
        Returns 200 once the process can accept inference requests, 503 if
        the detection model failed to load (or hasn't finished loading).
      responses:
        "200":
          description: Ready — the detector loaded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "503":
          description: Not ready — see body.detector.error for why
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /version:
    get:
      summary: Service version and uptime
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: visionserve-api }
                  version: { type: string, example: "0.1.0" }
                  uptime_seconds: { type: integer, example: 42 }

  /images/metadata:
    post:
      summary: Decode an image and report its metadata
      requestBody:
        $ref: "#/components/requestBodies/ImageUpload"
      responses:
        "200":
          description: Decoded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id: { type: string }
                  filename: { type: string }
                  format: { type: string, enum: [jpeg, png, bmp, webp] }
                  width: { type: integer }
                  height: { type: integer }
                  channels: { type: integer }
                  file_size_bytes: { type: integer }
                  timing:
                    type: object
                    properties:
                      decode_ms: { type: number }
                      total_ms: { type: number }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }

  /images/validate:
    post:
      summary: Check whether an upload is a decodable, within-limits image
      description: >
        Never hard-errors on a bad *image* (that's the point of the endpoint)
        — only a malformed *request* (unparseable body, missing file,
        oversized upload) returns a 4xx. A bad signature, failed decode, or
        over-limit pixel count is reported as a normal 200 with valid=false.
      requestBody:
        $ref: "#/components/requestBodies/ImageUpload"
      responses:
        "200":
          description: Always returned once the request itself is well-formed
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id: { type: string }
                  valid: { type: boolean }
                  reason:
                    type: string
                    nullable: true
                    enum: [unsupported_format, decode_failed, pixel_limit_exceeded, null]
                  format: { type: string }
                  width: { type: integer }
                  height: { type: integer }
                  timing:
                    type: object
                    properties:
                      decode_ms: { type: number }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /images/resize:
    post:
      summary: Resize an image and return the result
      description: >
        Returns the processed image bytes directly (not JSON). At least one
        of width/height is required; the other is derived to preserve aspect
        ratio if omitted.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                width: { type: integer }
                height: { type: integer }
                format: { type: string, enum: [jpg, jpeg, png], default: jpg }
              required: [file]
      responses:
        "200":
          description: Resized image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
          headers:
            X-Request-Id: { schema: { type: string } }
            X-Output-Width: { schema: { type: integer } }
            X-Output-Height: { schema: { type: integer } }
            X-Decode-Time-Ms: { schema: { type: number } }
            X-Resize-Time-Ms: { schema: { type: number } }
            X-Encode-Time-Ms: { schema: { type: number } }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }

  /images/grayscale:
    post:
      summary: Convert an image to grayscale and return the result
      description: Returns the processed image bytes directly (not JSON).
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                format: { type: string, enum: [jpg, jpeg, png], default: jpg }
              required: [file]
      responses:
        "200":
          description: Grayscale image
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
          headers:
            X-Request-Id: { schema: { type: string } }
            X-Output-Width: { schema: { type: integer } }
            X-Output-Height: { schema: { type: integer } }
            X-Decode-Time-Ms: { schema: { type: number } }
            X-Convert-Time-Ms: { schema: { type: number } }
            X-Encode-Time-Ms: { schema: { type: number } }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }

  /v1/detect:
    post:
      summary: Run object detection on an uploaded image
      description: >
        Runs the tiny-yolov2 detector (Pascal VOC's 20 classes) and returns
        detected bounding boxes. 503 if the model isn't ready (see /ready).
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                confidence_threshold:
                  type: number
                  default: 0.5
                  description: Clamped to [0, 1].
                iou_threshold:
                  type: number
                  default: 0.45
                  description: Non-max-suppression IoU threshold, clamped to [0, 1].
                max_detections: { type: integer, default: 100 }
                include_timing:
                  type: integer
                  default: 1
                  description: 0 omits the timing block from the response.
              required: [file]
      responses:
        "200":
          description: Detection completed (possibly with zero detections)
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id: { type: string }
                  model: { type: string, example: tiny-yolov2 }
                  version: { type: string, example: opset8 }
                  detections:
                    type: array
                    items: { $ref: "#/components/schemas/Detection" }
                  timing:
                    type: object
                    properties:
                      decode_ms: { type: number }
                      preprocess_ms: { type: number }
                      inference_ms: { type: number }
                      postprocess_ms: { type: number }
                      total_ms: { type: number }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

components:
  requestBodies:
    ImageUpload:
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              file: { type: string, format: binary }
            required: [file]

  responses:
    Error:
      description: >
        Structured error — see wiki Backend § Error schema. code is one of
        INVALID_REQUEST, MISSING_FILE, UNSUPPORTED_MEDIA_TYPE, FILE_TOO_LARGE,
        PIXEL_LIMIT_EXCEEDED, INVALID_IMAGE, MODEL_NOT_READY, INFERENCE_FAILED,
        INTERNAL_ERROR.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    StatusResponse:
      type: object
      properties:
        status: { type: string }
        service: { type: string }
        version: { type: string }
        detector:
          type: object
          description: Present on /ready only.
          properties:
            ready: { type: boolean }
            error: { type: string, description: "Only present when ready=false." }

    ErrorResponse:
      type: object
      properties:
        request_id: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }

    Detection:
      type: object
      properties:
        class_id: { type: integer }
        label: { type: string, example: person }
        confidence: { type: number }
        box:
          type: object
          description: Pixel coordinates in the original (uploaded) image.
          properties:
            x: { type: number }
            y: { type: number }
            width: { type: number }
            height: { type: number }
